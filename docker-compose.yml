services:
  web:
    image: emissium:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_SECRET: ${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
    volumes:
      - emissium-data:/app/data
    networks:
      - emissium-network

volumes:
  emissium-data:

networks:
  emissium-network:
    driver: bridge
